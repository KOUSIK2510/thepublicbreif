services:
  - type: web
    name: thepublicbrief-api
    env: node
    region: oregon
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "node backend/server.js"
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
