<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Article - Writer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  
  <!-- Quill Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-12">
  
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <a href="dashboard.html" class="text-sm font-medium text-gray-500 hover:text-gray-900 transition flex items-center">
            &larr; Back to Dashboard
          </a>
        </div>
        <div class="flex items-center">
          <h1 class="text-lg font-bold font-serif text-gray-900">Write Article</h1>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
      
      <!-- Error Message Container -->
      <div id="errorMessage" class="hidden bg-red-50 text-red-600 p-3 rounded mb-6 text-sm"></div>

      <form id="articleForm" class="space-y-6">
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Article Title</label>
          <input type="text" id="title" class="w-full px-4 py-2 text-xl font-bold border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Enter an engaging title..." required>
        </div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <select id="category" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
              <option value="World">World</option>
              <option value="National">National</option>
              <option value="Politics">Politics</option>
              <option value="Opinion">Opinion</option>
              <option value="Business">Business</option>
              <option value="Tech">Tech</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL (Optional)</label>
            <input type="url" id="imageUrl" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="https://...">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Article Body</label>
          <div id="editor-container" class="bg-white h-96 rounded-b-md"></div>
        </div>

        <div class="pt-4 flex justify-end">
          <button type="submit" id="submitBtn" class="inline-flex items-center px-6 py-3 border border-transparent rounded-md shadow-sm text-base font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
            Submit for Publishing
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      initEditor();
    });
  </script>
</body>
</html>
